<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    
    <audio src="" id="audio"></audio>
    
    <div class="column">
        <svg class="curved-text" viewBox="0 0 500 250">
            <defs>
                <path id="curve" d="M 30, 200 Q 250, 50 470, 200" fill="none"/>
            </defs>
            <text>
                <textPath href="#curve" startOffset="50%" text-anchor="middle" class="text-path años-bonito" style="font-size: 2rem; font-weight: bold;">
                    Edición especial 2026
                </textPath>
            </text>
        </svg>
        
        <div class="reproductor">
            <h1 class="nombre-musica">song one</h1>
            <p class="nombre-artista">artist</p>

            <div class="disk"></div>
            <div class="song-slider">
                <input type="range" value="0" class="seek-bar">
                <span class="tiempo-actual">00:00</span>
                <span class="duracion-cancion">00:00</span>
            </div>

            <div class="controles">
                <button class="btn backward-btn"><img src="img/pre.png" alt=""></button>
                <button class="play-btn pause">
                    <span></span>
                    <span></span>
                </button>
                <button class="btn forward-btn"><img src="img/nxt.png" alt=""></button>

                
            </div>

        </div>
    </div>
    <script src="js/data.js"></script>
    <script>
        (function() {
            let bgIndex = 0;
            function changeBackground() {
                if (typeof photos !== 'undefined' && photos.length > 0) {
                    document.body.style.backgroundImage = 'url(' + photos[bgIndex] + ')';
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundRepeat = 'no-repeat';
                    document.body.style.transition = 'background-image 1s ease-in-out';
                    bgIndex = (bgIndex + 1) % photos.length;
                }
            }
            changeBackground();
            setInterval(changeBackground, 10000);
        })();
    </script>
    <script src="js/java.js"></script>
</body>
</html>
